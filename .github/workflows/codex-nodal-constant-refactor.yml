name: codex nodal constant hot-path refactor

on:
  push:
    branches:
      - codex/nodal-constant-hotpath-refactor
    paths:
      - .github/workflows/codex-nodal-constant-refactor.yml

permissions:
  contents: write

concurrency:
  group: codex-nodal-constant-hotpath-refactor
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify extracted coefficient body
        run: python tools/test_nodal_constant_kernel.py

      - name: Apply production refactor
        run: python tools/apply_nodal_constant_refactor.py

      - name: Verify integration contract
        run: python tools/test_nodal_update_constant_integration.py

      - name: Verify patch hygiene
        run: |
          git diff --check
          grep -q 'bool Nodal::updateConstant' src/Nodal.cpp
          grep -q 'reduction(| : constants_changed)' src/Nodal.cpp
          test "$(grep -c '++_const_generation;' src/Nodal.cpp)" -eq 2

      - name: Commit production change
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git rm .github/workflows/codex-nodal-constant-refactor.yml
          git rm tools/apply_nodal_constant_refactor.py
          git add src/Nodal.cpp src/Nodal.h src/NodalConstantKernel.h \
                  tools/test_nodal_constant_kernel.py \
                  tools/test_nodal_update_constant_integration.py \
                  docs/superpowers/plans/2026-08-24-nodal-constant-hotpath-refactor.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(nodal): isolate constant kernel and aggregate dirty epoch'
          git push origin "HEAD:${BRANCH}"
