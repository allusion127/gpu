name: Export persistent CMFD development source

on:
  push:
    branches:
      - codex/cmfd-persistent-kernel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record source identity
        run: |
          git rev-parse HEAD > SOURCE_COMMIT
          git status --short > SOURCE_STATUS

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: persistent-cmfd-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
