name: Bootstrap exact nodal implementation tree

on:
  push:
    branches:
      - codex/exact-nodal-persistent-anderson
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-exact-nodal-tree
  cancel-in-progress: false

jobs:
  materialize-target-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize reviewed Git tree and push
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_TREE: a91787ae1d79aa91650c10c73f6cffc996f8e174
          TARGET_BRANCH: codex/exact-nodal-persistent-anderson
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_tree = os.environ["TARGET_TREE"]
          api = f"https://api.github.com/repos/{repo}"

          def request_json(url: str) -> dict:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "exact-nodal-tree-bootstrap",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          tree = request_json(f"{api}/git/trees/{target_tree}?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("target Git tree response was truncated; refusing to modify branch")

          target = {}
          for entry in tree.get("tree", []):
              kind = entry.get("type")
              mode = entry.get("mode")
              path = entry.get("path")
              sha = entry.get("sha")
              if kind == "tree":
                  continue
              if kind != "blob" or mode not in {"100644", "100755", "120000"}:
                  raise SystemExit(f"unsupported target entry: {path} type={kind} mode={mode}")
              target[path] = (mode, sha)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = {p for p in tracked if p}

          for path in sorted(tracked - set(target)):
              subprocess.run(["git", "rm", "-f", "--", path], check=True)

          for rel, (mode, sha) in sorted(target.items()):
              path = pathlib.Path(rel)
              current_matches = False
              if path.is_file() and not path.is_symlink():
                  current_sha = subprocess.check_output(["git", "hash-object", "--", rel], text=True).strip()
                  executable = bool(path.stat().st_mode & stat.S_IXUSR)
                  current_mode = "100755" if executable else "100644"
                  current_matches = current_sha == sha and current_mode == mode
              elif path.is_symlink() and mode == "120000":
                  current_sha = subprocess.check_output(["git", "hash-object", "--", rel], text=True).strip()
                  current_matches = current_sha == sha
              if current_matches:
                  continue

              blob = request_json(f"{api}/git/blobs/{sha}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(f"unexpected blob encoding for {rel}: {blob.get('encoding')}")
              payload = base64.b64decode(blob["content"])
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists() or path.is_symlink():
                  path.unlink()
              if mode == "120000":
                  path.symlink_to(payload.decode("utf-8"))
              else:
                  path.write_bytes(payload)
                  path.chmod(0o755 if mode == "100755" else 0o644)

          subprocess.run(["git", "add", "-A"], check=True)
          written = subprocess.check_output(["git", "write-tree"], text=True).strip()
          if written != target_tree:
              subprocess.run(["git", "status", "--short"], check=False)
              raise SystemExit(f"staged tree mismatch: expected {target_tree}, got {written}")
          PY

          git diff --cached --check
          git config user.name "OpenAI Codex"
          git config user.email "noreply@openai.com"
          git commit -m "perf: add full-exact persistent CMFD and safeguarded Anderson"
          git push origin "HEAD:${TARGET_BRANCH}"
